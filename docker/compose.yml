services:
  nullfin:
    image: ghcr.io/nullstreamin/nullfin:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nullfin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADDON_STREAM_TIMEOUT_MS: "12000"
    volumes:
      - nullfin-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  nullfin-data:
